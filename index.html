<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 智能錄音助理</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #2d2d2d; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 80%; max-width: 500px; }
        h1 { color: #4CAF50; margin-bottom: 0.5rem; }
        .visualizer-container { background: #000; height: 100px; width: 100%; border-radius: 10px; margin: 20px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .bar { width: 5px; height: 20px; background: #4CAF50; margin: 0 2px; border-radius: 5px; transition: height 0.1s; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 1rem; cursor: pointer; border: none; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        #start { background: #4CAF50; color: white; }
        #start:hover { background: #45a049; transform: scale(1.05); }
        #stop { background: #f44336; color: white; }
        #stop:disabled { background: #555; cursor: not-allowed; }
        .transcript-area { background: #3d3d3d; border-radius: 10px; padding: 15px; text-align: left; min-height: 100px; border-left: 5px solid #4CAF50; }
        .status { font-size: 0.9rem; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎤 AI 錄音助理</h1>
    <div class="status" id="status">狀態：準備就緒</div>
    
    <div class="visualizer-container" id="visualizer">
        </div>

    <div class="controls">
        <button id="start">開始錄音</button>
        <button id="stop" disabled>停止並下載</button>
    </div>

    <div style="text-align: left; margin-bottom: 5px;">📝 AI 逐字稿預覽：</div>
    <div class="transcript-area" id="transcript">
        等待錄音完成後，這裡將會顯示 AI 辨識結果...
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let audioContext;
    let analyser;
    let dataArray;
    let animationId;

    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const statusText = document.getElementById('status');
    const visualizer = document.getElementById('visualizer');

    // 產生音量波形條
    for(let i=0; i<20; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        visualizer.appendChild(bar);
    }
    const bars = document.querySelectorAll('.bar');

    startBtn.onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        // 視覺化設定
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        source.connect(analyser);
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateVisualizer() {
            analyser.getByteFrequencyData(dataArray);
            bars.forEach((bar, index) => {
                const val = dataArray[index % dataArray.length];
                bar.style.height = (val / 2) + 'px';
            });
            animationId = requestAnimationFrame(updateVisualizer);
        }
        updateVisualizer();

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `錄音_${new Date().toLocaleTimeString()}.mp3`;
            a.click();
            cancelAnimationFrame(animationId);
            statusText.innerText = "狀態：錄音已存檔，等待 AI 處理...";
            document.getElementById('transcript').innerText = "（示範模式）AI 偵測到您說了：『你好，這是一個漂亮的錄音助理介面！』";
        };

        audioChunks = [];
        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusText.innerText = "狀態：正在錄製音訊...";
    };

    stopBtn.onclick = () => {
        mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
    };
</script>

</body>
</html>
