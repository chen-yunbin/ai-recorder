<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 影音助理：錄製與切割工具</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center; width: 95%; max-width: 600px; }
        h1 { color: #00e676; margin-bottom: 1rem; }
        #preview { width: 100%; border-radius: 12px; background: #000; margin-bottom: 1rem; border: 2px solid #333; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        button { padding: 15px; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-start { background: #00e676; color: #000; grid-column: span 2; }
        .btn-stop { background: #ff5252; color: white; display: none; grid-column: span 2; }
        .btn-tool { background: #444; color: white; }
        .status-box { margin-top: 20px; padding: 10px; background: #252525; border-radius: 8px; font-size: 14px; color: #00e676; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 AI 錄製 & 切割器</h1>
        <video id="preview" autoplay muted playsinline></video>
        
        <div class="btn-group">
            <button id="startBtn" class="btn-start">開始錄影 (每5分鐘自動下載)</button>
            <button id="stopBtn" class="btn-stop">停止錄影</button>
            
            <label class="btn-tool" style="display: flex; align-items: center; justify-content: center; cursor: pointer;">
                📁 切割舊檔案
                <input type="file" id="fileInput" accept="video/*">
            </label>
            <button id="switchBtn" class="btn-tool">切換鏡頭/麥克風</button>
        </div>

        <div class="status-box" id="status">狀態：準備就緒</div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        const status = document.getElementById('status');

        // --- 功能 A：自動分段錄影 ---
        document.getElementById('startBtn').onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                document.getElementById('preview').srcObject = stream;
                
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        const url = URL.createObjectURL(e.data);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `AI片段_${new Date().getTime()}.webm`;
                        a.click();
                        status.innerText = "狀態：已自動存檔一個 5 分鐘片段";
                    }
                };
                
                // 設定每 5 分鐘 (300000ms) 自動切斷並觸發一次下載
                mediaRecorder.start(300000); 
                
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';
                status.innerText = "狀態：正在錄製，每 5 分鐘會自動跳出下載...";
            } catch (err) {
                alert("無法啟動設備：" + err.message);
            }
        };

        document.getElementById('stopBtn').onclick = () => {
            mediaRecorder.stop();
            location.reload(); 
        };

        // --- 功能 B：本地檔案切割 ---
        document.getElementById('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            status.innerText = "狀態：正在讀取大檔案...";

            const video = document.createElement('video');
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = async () => {
                const segmentSize = (file.size / video.duration) * 300; // 估算 5 分鐘的 Byte 大小
                let start = 0;
                let count = 1;

                while (start < file.size) {
                    const blob = file.slice(start, start + segmentSize);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `切割片段_${count}_${file.name}`;
                    a.click();
                    start += segmentSize;
                    count++;
                    status.innerText = `狀態：已產出第 ${count-1} 個小檔案...`;
                    await new Promise(r => setTimeout(r, 1000));
                }
                status.innerText = "狀態：切割完成！請將檔案傳給 AI";
            };
        };
    </script>
</body>
</html>
